<div class="card">

    <div class="card-title">
        ⚙ CONFIG
    </div>

    <!-- SAVE CONFIG -->
    <form method="POST" action="/save_config">

        <table class="info-table">

            <tr>
                <td>Coin</td>
                <td>
                    <input
                        type="text"
                        name="coin"
                        value="{{ config_data.coin }}">
                </td>
            </tr>

            <tr>
                <td>Entry Price</td>
                <td>
                    <input
                        type="number"
                        name="entry_price"
                        value="{{ config_data.entry_price_raw }}">
                </td>
            </tr>

            <tr>
                <td>Capital</td>
                <td>
                    <input
                        type="number"
                        name="capital"
                        value="{{ config_data.capital_raw }}">
                </td>
            </tr>

            <tr>
                <td>Take Profit</td>
                <td>
                    <input
                        type="number"
                        name="tp"
                        value="{{ config_data.take_profit }}">
                </td>
            </tr>

            <tr>
                <td>Trailing Gap</td>
                <td>
                    <input
                        type="number"
                        name="trailing_gap"
                        value="{{ config_data.trailing_gap }}">
                </td>
            </tr>

        </table>

        <button class="btn-save" type="submit">
            💾 SAVE CONFIG
        </button>

    </form>

    <div class="button-group">

        <form method="POST" action="/bot/start">

            <button class="btn-green" type="submit">
                🟢 START BOT
            </button>

        </form>

        <form method="POST" action="/bot/stop">

            <button class="btn-red" type="submit">
                🔴 STOP BOT
            </button>

        </form>

    </div>

    <form method="POST" action="/config/default">

        <button class="btn-default" type="submit">
            ↺ LOAD DEFAULT
        </button>

    </form>

</div>
