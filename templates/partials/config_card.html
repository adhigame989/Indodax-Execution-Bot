<div class="card">

    <div class="card-title">
        ⚙ CONFIG
    </div>

    <!-- CREATE TRADE -->
    <form id="trade-builder-form" method="POST" action="/create_trade">

        <table class="info-table">

            <tr>
                <td>Coin</td>

                <td>

                    <input
                        id="coin"
                        type="text"
                        name="coin"
                        value="{{ config_data.coin }}">

                    <div id="coin_status"
                         style="
                            margin-top:8px;
                            font-size:13px;
                            font-weight:bold;
                            color:#999;
                         ">

                        Checking...

                    </div>

                    <div id="coin_price"
                         style="
                            margin-top:4px;
                            font-size:13px;
                            color:#ccc;
                         ">

                        Current Value : -

                    </div>

                </td>

            </tr>

            <tr>

                <td>Capital</td>

                <td>

                    <input
                        type="number"
                        name="capital"
                        value="{{ config_data.capital_raw }}">

                </td>

            </tr>

            <tr>

                <td>Entry Price</td>

                <td>

                    <input
                        id="entry_price"
                        type="number"
                        name="entry_price"
                        value="{{ config_data.entry_price_raw }}">

                </td>

            </tr>

            <tr>

                <td>Target Price</td>

                <td>

                    <input
                        id="target_price"
                        type="number"
                        name="target_price"
                        value="{{ config_data.target_price_raw }}">

                </td>

            </tr>

            <tr>

                <td>Trailing Gap</td>

                <td>

                    <input
                        type="number"
                        name="trailing_gap"
                        value="{{ config_data.trailing_gap }}">

                </td>

            </tr>

        </table>

        <button
            id="save_btn"
            class="btn-save"
            type="submit">

            💾 CREATE TRADE

        </button>

    </form>

    <div class="button-group">

        <form method="POST" action="/bot/start">

            <button class="btn-green" type="submit">

                🟢 START BOT

            </button>

        </form>

        <form method="POST" action="/bot/stop">

            <button class="btn-red" type="submit">

                🔴 STOP BOT

            </button>

        </form>

    </div>

    <form method="POST" action="/config/default">

        <button
            class="btn-default"
            type="submit">

            ↺ LOAD DEFAULT

        </button>

    </form>

</div>

<script>

let timer = null;

const coinInput = document.getElementById("coin");

const statusDiv = document.getElementById("coin_status");

const priceDiv = document.getElementById("coin_price");

const saveBtn = document.getElementById("save_btn");

const entryPrice = document.getElementById("entry_price");

const targetPrice = document.getElementById("target_price");

let selectedCoin = "";

function rupiah(value){

    return "Rp " + Number(value).toLocaleString("id-ID");

}

async function validateCoin(){

    const coin = coinInput.value.trim();

    if(coin===""){

        statusDiv.innerHTML="⚪ Empty";

        statusDiv.style.color="#999";

        priceDiv.innerHTML="Current Value : -";

        saveBtn.disabled=true;

        return;

    }

    try{

        const response=await fetch(

            "/api/validate_coin?coin="+encodeURIComponent(coin)

        );

        const data=await response.json();

        if(data.valid){

            statusDiv.innerHTML="🟢 VALID PAIR";

            statusDiv.style.color="#33dd66";

            priceDiv.innerHTML=
                "Current Value : "+rupiah(data.price);

            saveBtn.disabled=false;

            if(selectedCoin!==coin){

                entryPrice.value=Math.round(data.price);

                targetPrice.value=Math.round(data.price);

                selectedCoin=coin;

            }
        }

        else{

            statusDiv.innerHTML="🔴 INVALID PAIR";

            statusDiv.style.color="#ff4444";

            priceDiv.innerHTML=

                "Current Value : N/A";

            saveBtn.disabled=true;

        }

    }

    catch(e){

        statusDiv.innerHTML="🟠 API ERROR";

        statusDiv.style.color="orange";

        priceDiv.innerHTML="Current Value : N/A";

        saveBtn.disabled=true;

    }

}

coinInput.addEventListener("input",function(){

    clearTimeout(timer);

    timer=setTimeout(validateCoin,500);

});

validateCoin();

setInterval(function(){

    validateCoin();

},5000);

    </script>
