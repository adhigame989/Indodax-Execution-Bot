<header class="navbar">

    <div class="navbar-left">

        <div class="logo">

            🤖

        </div>

        <div>

            <div class="app-title">

                {{ app_name }}

            </div>

            <div class="app-version">

                Version {{ version }}

            </div>

        </div>

    </div>

    <div class="navbar-right">

        {% if api_status == "Connected" %}

            <span class="status online">

                ● ONLINE

            </span>

        {% else %}

            <span class="status offline">

                ● OFFLINE

            </span>

        {% endif %}

    </div>

</header>
