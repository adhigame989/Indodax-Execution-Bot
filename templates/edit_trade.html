<!DOCTYPE html>
<html>
<head>
    <title>Edit Trade</title>
</head>
<body>

<h2>Edit Trade #{{ trade.trade_id }}</h2>

<form method="POST"
      action="/update_trade/{{ trade.id }}">

    <p>Coin</p>
    <input
        type="text"
        name="coin"
        value="{{ trade.coin }}"
        required>

    <p>Capital</p>
    <input
        type="number"
        name="capital"
        value="{{ trade.capital }}"
        required>

    <p>Entry Price</p>
    <input
        type="number"
        name="entry_price"
        value="{{ trade.entry_price }}"
        required>

    <p>Target Price</p>
    <input
        type="number"
        name="target_price"
        value="{{ trade.target_price }}"
        required>

    <p>Trailing Gap</p>
    <input
        type="number"
        step="0.1"
        name="trailing_gap"
        value="{{ trade.trailing_gap }}"
        required>

    <br><br>

    <button type="submit">
        SAVE
    </button>

</form>

</body>
</html>
