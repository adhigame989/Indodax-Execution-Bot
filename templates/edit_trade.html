<!DOCTYPE html>
<html>

<head>

    <title>Edit Trade</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="navbar">

        <div class="navbar-left">

            <div class="logo">
                🤖
            </div>

            <div>

                <div class="app-title">
                    Indodax Execution Bot
                </div>

                <div class="app-version">
                    Edit Trade
                </div>

            </div>

        </div>

    </div>

    <div class="container">

        <div class="card">

            <div class="card-title">
                ✏️ EDIT TRADE #{{ trade.id }}
            </div>

            <form method="POST"
                  action="/update_trade/{{ trade.id }}">

                <table class="info-table">

                    <tr>

                        <td>Coin</td>

                        <td>

                            <input
                                type="text"
                                name="coin"
                                value="{{ trade.coin }}"
                                required>

                        </td>

                    </tr>

                    <tr>

                        <td>Capital</td>

                        <td>

                            <input
                                type="number"
                                name="capital"
                                value="{{ trade.capital }}"
                                required>

                        </td>

                    </tr>

                    <tr>

                        <td>Entry Price</td>

                        <td>

                            <input
                                type="number"
                                name="entry_price"
                                value="{{ trade.entry_price }}"
                                required>

                        </td>

                    </tr>

                    <tr>

                        <td>Target Price</td>

                        <td>

                            <input
                                type="number"
                                name="target_price"
                                value="{{ trade.target_price }}"
                                required>

                        </td>

                    </tr>

                    <tr>

                        <td>Trailing Gap</td>

                        <td>

                            <input
                                type="number"
                                step="0.1"
                                name="trailing_gap"
                                value="{{ trade.trailing_gap }}"
                                required>

                        </td>

                    </tr>

                </table>

                <div class="button-group">

                    <a href="/"
                       class="btn-default"
                       style="
                       text-decoration:none;
                       text-align:center;
                       flex:1;
                       display:flex;
                       justify-content:center;
                       align-items:center;">

                        Cancel

                    </a>

                    <button
                        type="submit"
                        class="btn-green">

                        💾 Save Trade

                    </button>

                </div>

            </form>

        </div>

    </div>

</body>

</html>
