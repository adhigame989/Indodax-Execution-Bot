<link rel="stylesheet" href="/static/style.css">

<div class="edit-container">

    <div class="card edit-card">

        <div class="card-title">
            ✏️ EDIT TRADE #{{ trade.id }}
        </div>

        <form method="POST"
              action="/update_trade/{{ trade.id }}">

            <div class="form-group">
                <label>Coin</label>
                <input type="text"
                       name="coin"
                       value="{{ trade.coin }}">
            </div>

            <div class="form-group">
                <label>Capital</label>
                <input type="number"
                       name="capital"
                       value="{{ trade.capital }}">
            </div>

            <div class="form-group">
                <label>Entry Price</label>
                <input type="number"
                       name="entry_price"
                       value="{{ trade.entry_price }}">
            </div>

            <div class="form-group">
                <label>Target Price</label>
                <input type="number"
                       name="target_price"
                       value="{{ trade.target_price }}">
            </div>

            <div class="form-group">
                <label>Trailing Gap (%)</label>
                <input type="number"
                       step="0.1"
                       name="trailing_gap"
                       value="{{ trade.trailing_gap }}">
            </div>

            <div class="edit-buttons">

                <a href="/"
                   class="btn-cancel">

                    Cancel

                </a>

                <button
                    type="submit"
                    class="btn-update">

                    Save Trade

                </button>

            </div>

        </form>

    </div>

</div>
